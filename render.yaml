# Render Blueprint for UNI Tracking — one web service that hosts the NestJS API, the
# Socket.IO realtime namespace and the built dashboard on a single origin. Import it from
# GitHub (New + → Blueprint) and Render creates the service; the PostgreSQL it runs on is
# supplied through DATABASE_URL (see docs/RENDER.md for the free-tier limit behind that).
services:
  - type: web
    name: uni-tracking
    runtime: node
    plan: free # upgrade to starter for anything beyond testing
    region: oregon
    rootDir: apps/api
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/ping
    # rootDir is apps/api, so the dashboard build has to step out of it and back in.
    # `--include=dev` is not optional: NODE_ENV=production makes npm ci skip devDependencies,
    # and nest build / vite / the prisma CLI / ts-node all live there.
    buildCommand: >-
      npm ci --include=dev
      && cd ../../apps/dashboard && npm ci --include=dev && npm run build
      && cd ../../apps/api && npm run prisma:prod
      && npx nest build -p tsconfig.deploy.json
    # Explicit so a change to apps/api's `start` script can't silently move the entry point.
    #
    # The schema push and the seed run here rather than in a `preDeployCommand`, because Render
    # only offers pre-deploy commands on paid web services — on plan: free that key is ignored
    # and the service would boot against an empty database, i.e. no login would ever work.
    # Both steps are idempotent (`db push` no-ops when the schema already matches, the seed is
    # all upserts), so paying them again on every free-tier wake is what keeps this deployable.
    startCommand: npx prisma db push --skip-generate --accept-data-loss && npx ts-node prisma/seed.ts && node dist/main.js
    envVars:
      # Render's free tier keeps only ONE active Postgres per workspace and this account's slot
      # is already taken, so the service shares that instance instead of creating its own — but
      # through its OWN logical database (`uni_tracking`, made with `CREATE DATABASE`), never the
      # instance's default one. The start command pushes the schema with `--accept-data-loss`,
      # and Prisma drops every table it doesn't recognise, so pointing DATABASE_URL at another
      # project's database would delete that project. `synced: false` keeps the connection string
      # pasted in the dashboard from being overwritten by a later Blueprint sync.
      - key: DATABASE_URL
        synced: false
        value: ""
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set this in the Render dashboard after the first deploy — `synced: false` keeps a
      # Blueprint re-import from overwriting what you typed there.
      - key: ADMIN_INIT_PASSWORD
        synced: false
        value: ChangeMe123!
