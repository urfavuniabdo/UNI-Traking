# Analysis configuration for the Traccer mobile app.
# flutter_lints is the conservative baseline. See docs/CONTRACT.md for the binding rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    unawaited_futures: true
    directives_ordering: true
    prefer_final_locals: true
