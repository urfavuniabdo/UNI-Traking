name: traccer
description: >-
  UNI Tracking mobile app for Uni Group Egypt. Role-aware (driver / employee):
  the driver's screen is ONLY a check-in / check-out button — tracking, buffering and
  alerting happen fully automatically in the background.
publish_to: "none"
version: 0.1.0+2

environment:
  # Conservative pins so `flutter pub get` resolves on Flutter 3.16 / Dart 3.2.
  # These versions are known-good against each other; adjust only if the SDK demands it.
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State / routing / networking ---
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.3+1

  # --- Local persistence (offline write-ahead buffer) ---
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # --- Location & background execution ---
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2      # normally transitive, pinned for clarity
  flutter_background_service_ios: ^5.0.3           # normally transitive, pinned for clarity
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.1
  workmanager: ^0.10.10

  # --- Connectivity (data-offline detection) ---
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  battery_plus: ^7.0.0           # added beyond brief: drives `battery` in heartbeat/positions (§2/§4)

  # --- Messaging / notifications ---
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.2.1+1

  # --- Realtime (CONTRACT §7 notify:me while app is foregrounded) ---
  socket_io_client: ^2.0.3

  # --- UI ---
  intl: ^0.20.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  url_launcher: ^6.2.5            # "اتصل بالمشرف" tel: link on a fence violation
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Pure-Dart sqlite for DAO/buffer unit tests (no device needed).
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
  assets:
    - assets/strings/
    - assets/brand/logo.png
